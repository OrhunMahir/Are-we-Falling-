<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Are We Falling? · Intruder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #cab { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ixTop { position: absolute; left: 16px; top: 14px; font: 12px ui-monospace, Menlo, monospace; letter-spacing: 2px; color: #8491a3; background: rgba(8,11,16,.8); border: 1px solid #39414e; border-radius: 6px; padding: 10px 14px; }
  #ixTop b { color: #ff3b30; }
</style>
</head>
<body>
<!-- The INTRUDER seat on its own test page (Batu). Uses Orhun's cabin (js/cabin3d.js) unchanged.
     Open on a static server: intruder.html, add ?seed=1234 for the same passengers and tasks every time. -->
<canvas id="cab"></canvas>
<div id="ixTop"><b>INTRUDER</b> · ARE WE FALLING? · WORK IN PROGRESS</div>
<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/gltf.min.js"></script>
<script src="js/rules.js"></script>
<script src="js/roles/saboteur.js"></script>
<script src="js/roles/intruder-models.js"></script>
<script src="js/cabin3d.js"></script>
<script src="js/roles/intruder-play.js"></script>
<script>
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  const seed = +q.get('seed') || 1000 + Math.floor(Math.random() * 9000);
  const cabin = window.KKCabin && KKCabin.start(document.getElementById('cab'), { seed, role: 'saboteur', seat: q.get('seat') });
  if (!cabin) { document.body.insertAdjacentHTML('beforeend', '<p style="color:#fff">No 3D on this device.</p>'); return; }
  const play = KKIntruder.start(cabin, { seed, canvas: document.getElementById('cab'), seat: cabin.player.seat && cabin.player.seat.id });
  window.__intruder = { cabin, play, seed };
})();
</script>
</body>
</html>
