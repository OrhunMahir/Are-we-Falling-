<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Are We Falling? · Cabin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --txt: #d6dde8; --dim: #8491a3; --amber: #ffb000; --green: #3dff8b; --red: #ff3b30; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --cond: "Arial Narrow", "Helvetica Neue Condensed", "Roboto Condensed", Arial, sans-serif; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--txt); font-family: var(--cond); user-select: none; -webkit-user-select: none; }
  #cab { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: absolute; background: rgba(8, 11, 16, .78); border: 1px solid #39414e; border-radius: 6px; padding: 10px 14px; }
  #top { left: 16px; top: 14px; font-family: var(--mono); font-size: 12px; letter-spacing: 2px; color: var(--dim); }
  #top b { color: var(--amber); }
  #top a { color: var(--txt); margin-left: 12px; text-decoration: none; border-bottom: 1px solid #39414e; }
  #top a.on { color: var(--green); border-color: var(--green); }
  #where { left: 16px; top: 62px; font-size: 22px; letter-spacing: 1px; min-width: 190px; }
  #where small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--amber); min-height: 14px; margin-top: 3px; }
  #tasks { right: 16px; top: 14px; width: 310px; }
  #clock { font-family: var(--mono); font-size: 12px; letter-spacing: 2px; color: var(--dim); display: flex; justify-content: space-between; align-items: baseline; }
  #clock b { font-size: 30px; color: var(--txt); letter-spacing: 1px; }
  #clock b.up { color: var(--green); } #clock b.down { color: var(--red); }
  .task { border-top: 1px solid #2a313c; margin-top: 8px; padding-top: 8px; }
  .task h4 { margin: 0; font-size: 17px; letter-spacing: 1px; font-weight: 700; display: flex; justify-content: space-between; }
  .task h4 span { font-family: var(--mono); font-size: 12px; color: var(--amber); }
  .task p { margin: 3px 0 0; font-size: 14px; color: var(--dim); line-height: 1.25; }
  .task em { font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--amber); }
  .task.done { opacity: .5; } .task.done h4 { text-decoration: line-through; }
  .task.here { border-top-color: var(--amber); }
  #hold { left: 50%; bottom: 74px; transform: translateX(-50%); width: 380px; text-align: center; display: none; }
  #hold.show { display: block; }
  #holdT { font-size: 18px; letter-spacing: 1px; } #holdT kbd { font-family: var(--mono); background: var(--amber); color: #000; border-radius: 3px; padding: 0 7px; margin-right: 6px; }
  .bar { height: 8px; background: #1b1f26; border-radius: 4px; margin-top: 8px; overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: var(--amber); }
  #toast { left: 50%; top: 22%; transform: translateX(-50%); font-size: 24px; letter-spacing: 1px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #hint { left: 50%; bottom: 14px; transform: translateX(-50%); font-family: var(--mono); font-size: 11.5px; letter-spacing: 1px; color: var(--dim); white-space: nowrap; }
  #hint b { color: var(--txt); font-weight: 400; }
  #dbg { left: 16px; bottom: 14px; font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--dim); }
  #dbg label { display: flex; align-items: center; gap: 8px; margin-top: 4px; } #dbg input[type=range] { width: 110px; } #dbg select { font: inherit; color: #dfe6ee; background: #10141a; border: 1px solid #3a4250; border-radius: 4px; padding: 3px 5px; }
  #holdT kbd.ok { background: var(--green); }
  #end { left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; font-size: 20px; letter-spacing: 1px; padding: 22px 34px; display: none; }
  #end.show { display: block; } #end b { display: block; font-size: 40px; letter-spacing: 2px; margin-bottom: 6px; }
  #end.ok { border-color: var(--green); } #end.ok b { color: var(--green); } #end.bad { border-color: var(--red); } #end.bad b { color: var(--red); }
  body.embed #dbg { display: none; }
  #end { z-index: 60; }
  body.sabplay #where, body.sabplay #tasks, body.sabplay #hold, body.sabplay #toast, body.sabplay #hint, body.sabplay #top { display: none !important; }
  body.embed #ixEndB, body.over #ixEnd { display: none !important; }
  @media (max-width: 1100px) { #hint { display: none; } }
</style>
</head>
<body>
<canvas id="cab"></canvas>
<div id="top" class="hud"><b>ARE WE FALLING?</b> · CABIN · WORK IN PROGRESS <a id="rSab" href="?role=saboteur">INTRUDER</a><a id="rAtt" href="?role=attendant">FLIGHT ATTENDANT</a></div>
<div id="where" class="hud"><span id="whereT">…</span><small id="hoverT"></small></div>
<div id="tasks" class="hud"><div id="clock">TIME TO IMPACT <b id="clockT">7:00</b></div><div id="list"></div></div>
<div id="hold" class="hud"><div id="holdT"></div><div class="bar"><i id="holdB"></i></div></div>
<div id="toast" class="hud"></div>
<div id="end" class="hud"></div>
<div id="hint" class="hud"><b>DRAG</b> look · <b>CLICK</b> a free seat or a door to go there · <b>W S</b> walk the aisle · <b>F</b> stand up, sit down · <b>E</b> and <b>Q</b> work on a task</div>
<div id="dbg" class="hud">TEST CONTROLS
  <label><input id="dUnrest" type="range" min="0" max="100" value="0"> PASSENGERS ANGRY</label>
  <label><input id="dTurb" type="range" min="0" max="100" value="0"> TURBULENCE</label>
  <label><input id="dDoor" type="checkbox"> COCKPIT DOOR OPEN</label>
  <label id="dSabL" style="display:none"><select id="dSab"></select></label>
</div>

<script>
/* P toggles fullscreen: through the lobby page when this page sits in its frame, on its own otherwise */
window.addEventListener('keydown', function (e) {
  if ((e.key !== 'p' && e.key !== 'P') || e.repeat || e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) return;
  try { if (window.parent !== window && window.parent.__awfFull) { window.parent.__awfFull(); return; } } catch (x) {}
  var d = document, el = d.documentElement;
  try { if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (x) {}
}, true);
</script>
<script src="js/vendor/three.min.js"></script>
<script src="js/rules.js"></script>
<script src="js/roles/saboteur.js" onerror="void 0"></script>
<script src="js/roles/attendant.js" onerror="void 0"></script>
<script src="js/cabin3d.js"></script>
<script src="js/cabin-fit.js" onerror="void 0"></script>
<script src="js/cabin-cockpit.js" onerror="void 0"></script>
<script>
/* The cabin page. Two ways to run it:
   - on its own (cabin.html?role=saboteur): a test page with a stand-in clock and test controls;
   - inside the online lobby (cabin.html?embed=1&role=...): js/net.js puts it in a frame for the two cabin seats,
     sends the flight state in with postMessage({ awf: 1, st }) and gets finished tasks back with
     postMessage({ awf: 1, cab: { k: 'task', id, title, effect, fx } }).
   Either way it deals the tasks of one role from KK.ROLES and runs them. */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const role = q.get('role') === 'attendant' ? 'attendant' : 'saboteur';
  const embed = q.get('embed') === '1';
  const ROLE_NAME = { saboteur: 'INTRUDER', attendant: 'FLIGHT ATTENDANT' };
  if (embed) { document.body.classList.add('embed'); $('top').innerHTML = '<b>' + ROLE_NAME[role] + '</b> · ' + (role === 'saboteur' ? 'BRING THE AIRCRAFT DOWN. DO NOT GET NOTICED.' : 'KEEP THE CABIN CALM. BUY THE PILOT TIME.'); }
  else $(role === 'attendant' ? 'rAtt' : 'rSab').className = 'on';
  const up = (m) => { try { if (embed && window.parent !== window) window.parent.postMessage({ awf: 1, cab: m }, '*'); } catch (e) {} };
  // Who may walk into the cockpit. 'crew': the flight attendant at any time, the intruder only while the door stands cracked
  // open (Orhun's call, 14.11.). 'open': both, at any time; try it with cabin.html?cockpit=open, or change the default here.
  const COCKPIT_RULE = q.get('cockpit') === 'open' ? 'open' : 'crew';

  // in the lobby the passengers and the tasks come from the flight code, so wait for it
  if (embed && !+q.get('seed')) {
    $('whereT').textContent = 'BOARDING…'; $('tasks').style.display = 'none';
    window.addEventListener('message', (e) => { const d = e.data; if (d && d.awf === 1 && d.st && d.st.f && (d.st.ph === 'intro' || d.st.ph === 'flight')) go(d.st); });
    return;
  }
  // (re)load for a flight: the code seeds the cabin, sab and att say which cabin seats are taken
  function go(st) { location.replace('cabin.html?embed=1&role=' + role + '&seed=' + (+st.f) + (st.sab ? '&sab=1' : '') + (st.att ? '&att=1' : '') + (q.get('cockpit') ? '&cockpit=' + encodeURIComponent(q.get('cockpit')) : '')); }
  const seed = +q.get('seed') || 1000 + Math.floor(Math.random() * 9000);
  const cabin = window.KKCabin && KKCabin.start($('cab'), { seed, role, seat: q.get('seat') });
  if (!cabin) { $('whereT').textContent = 'NO 3D ON THIS DEVICE'; return; }
  const realCockpit = !!(window.__cockpit && cabin.setPass && cabin.places.cockpit);   // js/cabin-cockpit.js is on board: the room behind the door is the pilot's cockpit
  try { window.focus(); } catch (e) {}

  // Both cabin seats are played in first person: the intruder with Batu's layer (js/roles/intruder-play.js), the flight
  // attendant with js/roles/attendant-play.js, which borrows that layer's toolkit. They bring their own walking, task screen,
  // effects and sounds; this page connects them to the flight and to each other. ?plain=1 gives the old click-to-walk runner.
  const other = role === 'saboteur' ? 'attendant' : 'saboteur';
  const otherOn = q.get(role === 'saboteur' ? 'att' : 'sab') === '1';   // is the other cabin seat taken? (the lobby says so, or the test page's &att=1 / &sab=1)
  if (q.get('plain') !== '1') {
    const load = (src) => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
    load('js/vendor/gltf.min.js').catch(() => {}).then(() => load('js/roles/intruder-models.js')).catch(() => {}).then(() => load('js/roles/intruder-play.js'))
      .then(() => (role === 'attendant' ? load('js/roles/attendant-play.js') : null))
      .then(() => { if (role === 'saboteur' && window.KKIntruder) intruder(); else if (role === 'attendant' && window.KKAttendant) attendant(); else plain(); }).catch((e) => { console.warn('cabin layer', e); plain(); });
  } else plain();

  /* The link between the two cabin seats: in the lobby the messages go up to js/net.js (cab k:'link') and come back from the
     other seat; on the test page a BroadcastChannel joins two tabs (cabin.html?role=saboteur&att=1 and ?role=attendant&sab=1). */
  function makeLink() {
    if (!embed) return window.KKLink ? KKLink.local(q.get('room') || 'test') : null;
    const subs = []; let poseT = 0;
    window.addEventListener('message', (e) => {
      const d = e.data; if (!d || d.awf !== 1 || !d.cab || d.cab.k !== 'link' || d.cab.role === role || !d.cab.m) return;
      subs.forEach((f) => { try { f(d.cab.m); } catch (er) { console.error(er); } });
    });
    return {
      send(m) {
        if (!m || !m.t) return;
        window.__linkTx = (window.__linkTx || 0) + 1;   // for the tests
        if (m.t === 'pose') { const now = performance.now(); if (now - poseT < 140) return; poseT = now; }   // seven a second is plenty
        up({ k: 'link', m });
      },
      on(f) { subs.push(f); },
    };
  }
  // the cockpit door: what this seat does to it goes to the lobby (the pilot keeps the state and sends it back as st.dr)
  const rawDoor = cabin.setDoor.bind(cabin); let myDoor = false, theirDoor = false;
  cabin.setDoor = function (v) { v = !!v; if (v !== myDoor) { myDoor = v; up({ k: 'door', open: v }); } rawDoor(myDoor || theirDoor); };
  function doorFromLobby(dr) { theirDoor = !!dr && !myDoor; rawDoor(myDoor || theirDoor); }
  // the flight's phase changed: the layers play the end inside the cabin
  function phaseTo(play, ph) { if (ph === 'landing' || ph === 'won') play.land(); else if (ph === 'crashed') play.crash(); }

  function attendant() {
    document.body.classList.add('sabplay');
    const link = makeLink();
    if (realCockpit) cabin.setPass(true);
    let phase = embed ? 'intro' : 'flight', wasIn = false;
    const play = KKAttendant.start(cabin, {
      seed, canvas: $('cab'), link, intruder: otherOn,
      onTask: (m) => up(m),
      onCockpit: (inside) => { if (inside !== wasIn) { wasIn = inside; up({ k: 'cockpit', in: inside }); } },
      onDoor: () => {},
      onCaught: () => {},
    });
    if (!play) { plain(); return; }
    play.setFlight({ flying: !embed });
    // the test page: a sabotage picked in the test controls, or played from a second tab (cabin.html?role=saboteur&att=1)
    if (!embed) {
      const sel = $('dSab'), pool = (KK.ROLES && KK.ROLES.attendant) || { tasks: [] }; $('dSabL').style.display = ''; $('dbg').style.zIndex = 70;
      sel.innerHTML = '<option value="">A SABOTAGE HAPPENS…</option>' + pool.tasks.filter((t) => t.undoes).map((t) => '<option value="' + t.undoes + '">' + String(t.undoes).toUpperCase() + ' → ' + t.title + '</option>').join('');
      sel.onchange = () => { if (sel.value) play.trouble(sel.value); sel.value = ''; sel.blur(); };
      $('dUnrest').oninput = (e) => play.setFlight({ unrest: e.target.value / 100 });
      if (link) link.on((m) => { if (m.t === 'task') { play.trouble(m.id); if (m.id === 'cockpit') play.cracked(12); } });
    }
    let posT = 0, lastAt = '';
    setInterval(() => {   // the old position report (the pilot's lobby code and older pages read it)
      const P = cabin.player, here = P.seat ? P.seat.id : P.place;
      posT += 0.5; if (here !== lastAt || posT > 3) { posT = 0; lastAt = here; up({ k: 'pos', at: here }); }
    }, 500);
    window.addEventListener('message', (e) => {
      const d = e.data; if (!embed || !d || d.awf !== 1) return;
      if (d.cab && d.cab.role === 'saboteur' && d.cab.k === 'task') { play.trouble(d.cab.id); if (String(d.cab.id).toLowerCase() === 'cockpit') play.cracked(12); }
      if (!d.st) return;
      const st = d.st;
      if (st.f && +st.f !== seed && (st.ph === 'intro' || st.ph === 'flight')) { go(st); return; }
      play.setFlight({ clock: st.tl, total: st.tot, unrest: st.u, turb: st.tb, intruder: !!st.sab, flying: st.ph === 'flight' });
      doorFromLobby(st.dr);
      if (st.ph && st.ph !== phase) { phase = st.ph; phaseTo(play, phase); }
    });
    window.__cabin = { cabin, play, tasks: play.state.tasks, seed, role, embed, link, get clock() { return play.state.clock; }, get phase() { return phase; } };
  }

  function intruder() {
    document.body.classList.add('sabplay');   // not 'ix': that class belongs to the layer's own boxes
    const link = otherOn ? makeLink() : null;   // a player in the attendant seat: no AI attendant, the two screens talk
    const play = KKIntruder.start(cabin, { seed, mode: (KK.codeMode && KK.codeMode(seed)) || 'mayday', canvas: $('cab'), seat: cabin.player.seat && cabin.player.seat.id, clock: 420, link });   // the flight code's first digit is the mode
    const sent = {}; let phase = 'intro', lastAt = '', posT = 0, over = false;
    const endCard = (cls, html) => { over = true; document.body.classList.add('over'); $('end').className = 'hud show ' + cls; $('end').innerHTML = html; try { document.exitPointerLock(); } catch (e) {} };
    setInterval(() => {
      const S = play.state, P = cabin.player;
      S.tasks.forEach((t) => { if (t.done && !sent[t.def.id]) { sent[t.def.id] = 1; up({ k: 'task', id: t.def.id, title: t.def.title, effect: t.def.effect, fx: t.def.fx || [] }); } });
      let here = P.seat ? P.seat.id : KKIntruder.placeAt(P.x, P.z); if (here === 'cockpit' && !realCockpit) here = 'door';
      if (COCKPIT_RULE === 'open' && realCockpit && S.fx && !S.done) { S.door = true; S.fx.door = Math.max(S.fx.door || 0, 2); cabin.setDoor(true); }   // 'open': the door never locks for the intruder
      posT += 0.25; if (here !== lastAt || posT > 3) { posT = 0; lastAt = here; up({ k: 'pos', at: here }); }
    }, 250);
    window.addEventListener('message', (e) => {
      const d = e.data; if (!d || d.awf !== 1) return;
      // the flight attendant fixed something: what that sabotage started ends here too (`clears` in js/roles/attendant.js).
      // Done through the layer's public state: fx is a map of effect -> seconds left.
      if (d.cab && d.cab.role === 'attendant' && d.cab.k === 'task') {
        const pool = (window.KK && KK.ROLES && KK.ROLES.attendant) || { tasks: [] }, want = String(d.cab.id || '').toLowerCase();
        const def = pool.tasks.find((t) => String(t.id).toLowerCase() === want), S = play.state;
        ((def && def.clears) || []).forEach((type) => { if (type === 'panic') S.unrest = Math.max(0, (S.unrest || 0) - 0.3); else if (S.fx && S.fx[type] > 0) S.fx[type] = 0; });
      }
      if (!d.st) return;
      const st = d.st;
      if (st.f && +st.f !== seed && (st.ph === 'intro' || st.ph === 'flight')) { go(st); return; }
      if (st.tl != null && !play.state.done) play.state.clock = Math.max(1, +st.tl);   // the real time to impact
      doorFromLobby(st.dr);
      if (st.ph && st.ph !== phase) {
        phase = st.ph;
        // the layer plays the end inside the cabin itself: the dive and the impact, or the landing (older layers: our own card)
        if (phase === 'landing' || phase === 'won') { if (play.land) play.land(); else { endCard('bad', '<b>THE AIRCRAFT LANDED</b>The crew beat you.'); try { play.stop(); } catch (er) {} } }
        else if (phase === 'crashed') { if (play.crash) play.crash(); else { endCard('ok', '<b>AIRCRAFT LOST</b>That was your doing.'); try { play.stop(); } catch (er) {} } }
      }
    });
    window.__cabin = { cabin, play, tasks: play.state.tasks, seed, role, embed, link, get clock() { return play.state.clock; }, get phase() { return phase; } };
  }

  function plain() {
  // the test page shows a stand-in for the other seat; in the lobby the real one is drawn when they report in
  if (!embed) {
    if (role === 'saboteur') cabin.setActor('other', { role: 'attendant', at: 'galley' });
    else { const free = cabin.seats.filter((s) => !s.taken); cabin.setActor('other', { role: 'saboteur', at: free[seed % free.length].id }); }
  }

  // deal the tasks of this role from the flight code, so every screen gets the same ones
  const pool = (window.KK && KK.ROLES && KK.ROLES[role]) || { perFlight: 0, tasks: [] };
  const rng = KK.makeRng((seed * 31 + (role === 'attendant' ? 7 : 3)) >>> 0);
  const mk = (def) => ({ def, done: false, prog: 0, idx: 0, last: '' });
  // A pool whose tasks answer to something (`undoes`, the flight attendant's) is not dealt at random: the list starts
  // with the `always` tasks only and the others are opened one by one with openTask() when their trouble turns up.
  const reactive = pool.tasks.some((t) => t.undoes);
  const deck = pool.tasks.slice();
  for (let i = deck.length - 1; i > 0; i--) { const j = rng.int(0, i); const t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
  const tasks = (reactive ? pool.tasks.filter((t) => t.always) : deck.slice(0, pool.perFlight || 3)).map(mk);

  const NAMES = { seat: 'ANY SEAT', aisle: 'AISLE', lavatory: 'LAVATORY', galley: 'GALLEY', door: 'COCKPIT DOOR', cockpit: 'COCKPIT' };
  // with the real cockpit behind the door, KISS THE PILOT is done in there, beside the captain (its `place` in the pool still says 'door')
  const spotOf = (def) => (realCockpit && def.id === 'kiss' ? 'cockpit' : def.place);
  if (realCockpit) cabin.setPass(role === 'attendant' || COCKPIT_RULE === 'open');
  const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sgn = (n) => (n > 0 ? '+' : '') + n;
  let clock = embed ? 0 : 420, phase = embed ? 'intro' : 'flight', cur = null, eDown = false, toastT = 0, lastAt = '';
  let wasCk = false, crackT = 0, otherIn = false, doorWant = false;   // in the cockpit; the door: cracked open by the intruder (seconds left), the other seat inside
  function paint() {
    $('list').innerHTML = tasks.length ? tasks.map((t) => '<div class="task' + (t.done ? ' done' : '') + (t === cur ? ' here' : '') + '"><h4>' + esc(t.def.title) + '<span>' + sgn(t.def.effect) + ' s</span></h4><p>' + esc(t.def.brief) + '</p><em>' + (t.done ? 'DONE' : '▸ ' + (NAMES[spotOf(t.def)] || esc(spotOf(t.def)))) + '</em></div>').join('')
      : reactive ? '<div class="task"><p>All quiet in the cabin. Keep your eyes open.</p></div>'
      : '<div class="task"><p>No task pool for this seat yet. Add tasks to js/roles/' + role + '.js.</p></div>';
    cabin.setMarks(tasks.filter((t) => !t.done).map((t) => spotOf(t.def)));
  }
  function toast(txt) { $('toast').textContent = txt; $('toast').classList.add('show'); toastT = 2.8; }
  // puts a task of the pool on the list (by its id). A task that is still open stays as it is; a finished one comes
  // back, unless it is `once`. Returns the entry, or null when nothing was opened.
  function openTask(id) {
    const def = pool.tasks.find((t) => t.id === id); if (!def) return null;
    let t = tasks.find((x) => x.def === def);
    if (t) { if (!t.done || def.once) return null; t.done = false; t.prog = 0; t.idx = 0; t.last = ''; }
    else { t = mk(def); tasks.push(t); }
    paint(); where();
    return t;
  }
  function where() {
    const a = cabin.at();
    $('whereT').textContent = a.place === 'seat' ? 'SEAT ' + a.seat : a.place === 'moving' ? 'WALKING…' : (NAMES[a.place] || a.place);
    const here = a.place === 'seat' ? a.seat : a.place;
    if (a.place !== 'moving' && here !== lastAt) { lastAt = here; up({ k: 'pos', at: here }); }
    const inCk = realCockpit && cabin.player.z < -0.1;   // through the cockpit door: the pilot hears about it and sees who it is
    if (inCk !== wasCk) { wasCk = inCk; up({ k: 'cockpit', in: inCk }); }
    const before = cur;
    cur = phase === 'flight' ? tasks.find((t) => !t.done && spotOf(t.def) === a.place) || null : null;
    if (cur !== before) paint();
  }
  function finish(t) {
    t.done = true;
    if (!embed) clock = Math.max(0, clock + t.def.effect);
    $('clockT').className = t.def.effect > 0 ? 'up' : 'down';
    toast(t.def.title + ' · ' + sgn(t.def.effect) + ' SECONDS');
    if (t.def.sound) { try { const a = new Audio('audio/' + String(t.def.sound).replace(/[^\w]/g, '') + '.mp3'); a.volume = 0.7; const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {} }
    // a task that clears panic also tells the pilot's game to calm the passengers a little more ('calm')
    const fx = (t.def.fx || []).concat((t.def.clears || []).indexOf('panic') >= 0 ? [{ type: 'calm', amount: 0.15 }] : []);
    up({ k: 'task', id: t.def.id, title: t.def.title, effect: t.def.effect, fx });
    if ((t.def.clears || []).indexOf('door') >= 0) crackT = 0;   // locked again
    cur = null; paint(); where();
  }
  // how a task is worked: 'hold' (hold E), 'mash' (alternate Q and E), 'code' (type the keys in `code`)
  function key(k) {
    if (!cur) return;
    const d = cur.def, mode = d.input || 'hold';
    if (mode === 'mash') { if (k !== cur.last) { cur.last = k; cur.prog += d.seconds / 14; } }
    else if (mode === 'code') { const code = String(d.code || 'QE').toLowerCase(); if (k === code[cur.idx]) { cur.idx++; cur.prog = d.seconds * cur.idx / code.length; } else { cur.idx = k === code[0] ? 1 : 0; cur.prog = d.seconds * cur.idx / code.length; } }
  }
  function holdLabel(t) {
    const d = t.def, mode = d.input || 'hold';
    if (mode === 'mash') return '<kbd>Q</kbd><kbd>E</kbd>TAP IN TURNS · ' + esc(d.title);
    if (mode === 'code') return String(d.code || 'QE').toUpperCase().split('').map((c, i) => '<kbd' + (i < t.idx ? ' class="ok"' : '') + '>' + esc(c) + '</kbd>').join('') + 'TYPE · ' + esc(d.title);
    return '<kbd>E</kbd>HOLD · ' + esc(d.title);
  }
  cabin.on('arrive', where); cabin.on('leave', where);
  cabin.on('hover', (h) => { $('hoverT').textContent = !h ? '' : h.seat ? 'CLICK: SIT IN ' + h.seat : h.place === 'cockpit' ? 'CLICK: STEP INTO THE COCKPIT' : 'CLICK: GO TO THE ' + NAMES[h.place]; });
  // A task may bring a screen effect of its own (`anim`, played by the role's file through pool.play). It starts with
  // the first key on the task and is told how the task is going: 'working', 'done', or 'left' (the player let go).
  function anim() {
    const t = cur; if (!t || !t.def.anim || typeof pool.play !== 'function') return;
    const hold = (t.def.input || 'hold') === 'hold';
    try { pool.play(t.def.anim, { state: () => (t.done ? 'done' : cur === t && (!hold || eDown) ? 'working' : 'left') }); } catch (e) {}
  }
  window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k === 'e') eDown = true; if ((k === 'e' || k === 'q') && !e.repeat) { key(k); anim(); } });
  window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() === 'e') eDown = false; });
  $('dUnrest').oninput = (e) => cabin.setState({ unrest: e.target.value / 100 });
  $('dTurb').oninput = (e) => cabin.setState({ turb: e.target.value / 100 });
  $('dDoor').onchange = (e) => cabin.setDoor(e.target.checked);

  // a sabotage was finished somewhere in the cabin: the flight attendant gets the task that undoes it
  function trouble(id, label) {
    if (!reactive) return false;
    const want = String(id || '').toLowerCase();   // the lobby sends ids in capitals
    const def = pool.tasks.find((t) => t.undoes && String(t.undoes).toLowerCase() === want);
    const t = def && openTask(def.id);
    if (t && (def.clears || []).indexOf('door') >= 0) crackT = 12;   // the cockpit door stands open, as long as it does on the intruder's screen
    if (t) toast((label || 'TROUBLE IN THE CABIN') + ' · ' + def.title);
    return !!t;
  }
  // With no intruder on board the same trouble turns up by itself now and then, as a plain malfunction, so the flight
  // attendant still has work. A malfunction costs no time; fixing it gives the task's seconds as usual.
  // Is there an intruder? The lobby says so in `st.sab`; without that, anything heard from the saboteur seat counts.
  let sabSeat = null, sawSab = q.get('intruder') === '1', flightT = 0, nextFault = 0;
  const frng = KK.makeRng((seed * 131 + 17) >>> 0);
  function faults(dt) {
    if (!reactive || phase !== 'flight' || (sabSeat != null ? sabSeat : sawSab)) return;
    flightT += dt;
    if (!nextFault) nextFault = 20 + frng.int(0, 15);                      // the first one after 20 to 35 seconds
    if (flightT < nextFault) return;
    nextFault = flightT + 45 + frng.int(0, 30);                            // then every 45 to 75 seconds
    if (tasks.filter((t) => !t.done && t.def.undoes).length >= 2) return;   // never more than two waiting
    const can = pool.tasks.filter((d) => d.undoes && !tasks.some((t) => t.def === d && (!t.done || d.once)));
    if (can.length) trouble(can[frng.int(0, can.length - 1)].undoes, 'MALFUNCTION');
  }
  // without a lobby: pick a sabotage from the test controls, or let Batu's page do it from a second tab
  // (intruder.html?attendant=player talks over a BroadcastChannel, see KKLink in js/roles/intruder-play.js)
  if (reactive && !embed) {
    const sel = $('dSab'); $('dSabL').style.display = '';
    sel.innerHTML = '<option value="">A SABOTAGE HAPPENS…</option>' + pool.tasks.filter((t) => t.undoes).map((t) => '<option value="' + esc(t.undoes) + '">' + esc(String(t.undoes).toUpperCase() + ' → ' + t.title) + '</option>').join('');
    sel.onchange = () => { if (sel.value) trouble(sel.value); sel.value = ''; sel.blur(); };
    try { const ch = new BroadcastChannel('awf-cabin-' + (q.get('room') || 'test')); ch.onmessage = (e) => { const m = e.data; sawSab = true; if (m && m.t === 'task') trouble(m.id); }; } catch (e) {}
  }

  // the lobby sends the flight in: the clock, the mood of the cabin, the end, and where the other cabin seat is
  window.addEventListener('message', (e) => {
    const d = e.data; if (!embed || !d || d.awf !== 1) return;
    if (d.st) {
      const st = d.st;
      if (st.f && +st.f !== seed && (st.ph === 'intro' || st.ph === 'flight')) { go(st); return; }
      if (st.tl != null) clock = +st.tl;
      if (st.sab != null) sabSeat = !!st.sab;
      cabin.setState({ unrest: +st.u || 0, turb: +st.tb || 0 });
      if (st.ph && st.ph !== phase) {
        phase = st.ph;
        const up2 = phase === 'landing' || phase === 'won', down = phase === 'crashed', sab = role === 'saboteur';
        $('end').className = up2 || down ? 'hud show ' + (up2 !== sab ? 'ok' : 'bad') : 'hud';
        $('end').innerHTML = up2 ? (sab ? '<b>THE AIRCRAFT LANDED</b>The crew beat you.' : '<b>ON THE GROUND</b>You kept the cabin together.') : down ? (sab ? '<b>AIRCRAFT LOST</b>That was your doing.' : '<b>AIRCRAFT LOST</b>') : '';
        if (down) cabin.setState({ turb: 1, unrest: 1 });
      }
    }
    if (d.cab && d.cab.role && d.cab.role !== role) {
      if (d.cab.role === 'saboteur') sawSab = true;
      if (d.cab.k === 'pos' && d.cab.at) { cabin.setActor('other', { role: d.cab.role, at: d.cab.at }); otherIn = d.cab.at === 'cockpit'; }
      else if (d.cab.k === 'task') { if (!(d.cab.role === 'saboteur' && trouble(d.cab.id))) toast(d.cab.role === 'saboteur' ? 'SOMETHING IS WRONG IN THE CABIN' : 'THE FLIGHT ATTENDANT IS AT WORK'); }
    }
  });

  let last = performance.now(), posT = 0;
  setInterval(() => {
    const now = performance.now(), dt = Math.min(0.25, (now - last) / 1000); last = now;
    where(); faults(dt);
    crackT = Math.max(0, crackT - dt);
    if ((crackT > 0 || otherIn) !== doorWant) { doorWant = !doorWant; cabin.setDoor(doorWant); }
    if (realCockpit && role !== 'attendant' && COCKPIT_RULE !== 'open') cabin.setPass(cabin.door() > 0.5 || cabin.player.z < 0.6);   // anybody else gets in only through an open door
    posT += dt; if (posT > 3) { posT = 0; if (lastAt) up({ k: 'pos', at: lastAt }); }   // say it again, the other page may have just loaded
    if (!embed) clock = Math.max(0, clock - dt);
    $('clockT').textContent = fmt(clock);
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) { $('toast').classList.remove('show'); $('clockT').className = ''; } }
    $('hold').classList.toggle('show', !!cur);
    if (!cur) return;
    if (eDown && (cur.def.input || 'hold') === 'hold') cur.prog += dt;
    $('holdT').innerHTML = holdLabel(cur);
    $('holdB').style.width = Math.min(100, cur.prog / cur.def.seconds * 100) + '%';
    if (cur.prog >= cur.def.seconds - 1e-6) finish(cur);
  }, 50);
  paint(); where();
  window.__cabin = { cabin, tasks, openTask, trouble, faults, seed, role, embed, get clock() { return clock; }, get phase() { return phase; } };
  }
})();
</script>
</body>
</html>
